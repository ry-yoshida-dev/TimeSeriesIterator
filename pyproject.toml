[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "time-series-iterator"
version = "0.0.1"
authors = [
  { name = "Ryuto Yoshida" },
]
description = "Iterators for time-series data with configurable sampling and index base."
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "id-manager @ git+https://github.com/ry-yoshida-dev/IDManager.git",
    "video-handler @ git+https://github.com/ry-yoshida-dev/VideoHandler.git",
    "progress-bar[tqdm] @ git+https://github.com/ry-yoshida-dev/ProgressBar.git",
    "torch_modules @ git+https://github.com/ry-yoshida-dev/TorchModules.git",
    "numpy",
    "opencv-contrib-python",
    "torch",
]

[project.urls]
Homepage = "https://github.com/ry-yoshida-dev/TimeSeriesIterator"
"Bug Tracker" = "https://github.com/ry-yoshida-dev/TimeSeriesIterator/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.mypy]
files = ["src", "tests"]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]

[dependency-groups]
dev = [
    "basedpyright>=1.40.2",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.uv]
exclude-newer = "7 days"

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "D"]
# Only public classes, methods, and functions need docstrings, and multi-line ones are the local style.
ignore = ["E501", "D100", "D104", "D105", "D200"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]

