[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "time-series-iterator"
version = "0.0.1"
authors = [
  { name = "Ryuto Yoshida" },
]
description = "Iterators for time-series media data with configurable sampling and index base."
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "id-manager @ git+https://github.com/ry-yoshida-dev/IDManager.git",
    "video-handler @ git+https://github.com/ry-yoshida-dev/VideoHandler.git",
    "progress-bar[tqdm] @ git+https://github.com/ry-yoshida-dev/ProgressBar.git",
    "torch_modules @ git+https://github.com/ry-yoshida-dev/TorchModules.git",
    "torchcodec",
    "numpy",
    "opencv-contrib-python",
    "torch",
]


[project.urls]
Homepage = "https://github.com/ry-yoshida-dev/TimeSeriesIterator"
"Bug Tracker" = "https://github.com/ry-yoshida-dev/TimeSeriesIterator/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
torchcodec = [
    { path = "wheels/torchcodec-0.16.0a0+7861421-cp314-cp314-linux_x86_64.whl", marker = "sys_platform == 'linux'" },
]
